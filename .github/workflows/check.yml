name: check

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          runtime: node@^24.18.0

      - name: Install dependencies
        run: pnpm ci

      - name: Build source files
        run: pnpm run bundle

      - name: Linter Test
        run: pnpm run lint:check

      - name: Docs Test
        run: |
          pnpm run --filter @vuepress/ecosystem-docs docs:build
          pnpm run --filter @vuepress/ecosystem-docs docs:build-webpack

      - name: Unit Test
        run: pnpm run test:unit
