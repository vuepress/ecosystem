name: release

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        description: Dry-Run
      prerelease:
        type: boolean
        description: Force prerelease
      graduate:
        type: boolean
        description: Force Conventional Graduate
      publish_only:
        type: boolean
        description: 'Skip running `lerna version` and run publish-only retry (useful to retry failed publish)'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish packages
    runs-on: ubuntu-latest

    steps:
      - name: Check if user is allowed to push new release
        if: ${{ github.actor != 'Mister-Hope' }}
        run: |
          echo "You are not allowed to push new release."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.20.0

      - name: Install Deps
        run: pnpm ci

      - name: Build project
        run: pnpm run bundle

      - name: Linting check
        run: pnpm lint:check

      - name: Test check
        run: pnpm test

      - name: Config git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Lerna Version${{ inputs.dryrun == true && ' with dry run' || '' }}
        if: ${{ inputs.publish_only != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec lerna version ${{ inputs.dryrun == true && '--dry-run' || '' }} ${{ inputs.graduate == true && '--conventional-graduate' || inputs.prerelease == true && '--conventional-prerelease' || '' }} --yes

      - name: Publish packages${{ inputs.dryrun == true && ' with dry run' || '' }}
        run: |
          pnpm exec lerna publish --dist-tag next from-package --force-publish --yes${{ inputs.dryrun == true && ' --dry-run' || '' }}

      - name: Sync npmmirror
        if: ${{ inputs.dryrun != true }}
        run: pnpm exec unrun scripts/syncNpmmirror.ts

  deploy-docs:
    name: Deploy ecosystem docs to Netlify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@^24.18.0

      - name: Install deps
        run: pnpm ci

      - name: Build source files
        run: pnpm run bundle

      - name: Docs build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run --filter @vuepress/ecosystem-docs docs:build

      - name: Deploy docs
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: netlify
          folder: docs/.vuepress/dist
          single-commit: true
