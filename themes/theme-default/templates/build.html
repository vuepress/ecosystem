<!doctype html>
<html lang="{{ lang }}" data-appearance="auto">
  <head>
    <script>
      ;(() => {
        const root = document.documentElement
        // appearance is injected into this template at build time, so the very
        // first paint can follow the site config instead of only the browser
        // preferences and the storage
        const appearance = root.dataset.appearance || 'auto'
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        let isDark = false

        if (appearance === 'force-dark') {
          isDark = true
        } else if (appearance === 'force-auto') {
          isDark = prefersDark
        } else if (appearance === 'light') {
          isDark = false
        } else {
          const fallback = appearance === 'dark' ? 'dark' : 'auto'
          const preference =
            localStorage.getItem('vuepress-color-scheme') || fallback

          isDark = preference === 'auto' ? prefersDark : preference === 'dark'
        }

        root.dataset.theme = isDark ? 'dark' : 'light'
      })()
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="generator" content="VuePress {{ version }}" />
    <style>
      :root {
        --vp-c-bg: #fff;
      }

      html[data-theme='dark'] {
        --vp-c-bg: #1b1b1f;
      }

      html,
      body {
        background-color: var(--vp-c-bg);
      }

      /* the theme css is loaded asynchronously, so the first paint has to use
         the theme text color to avoid a flash of the browser default color */
      body {
        color: #3c3c43;
      }

      html[data-theme='dark'] body {
        color: #dfdfd6;
      }
    </style>
    <!--vuepress-ssr-head-->
    <!--vuepress-ssr-styles-->
    <!--vuepress-ssr-preload-->
    <!--vuepress-ssr-prefetch-->
  </head>
  <body>
    <div id="app"><!--vuepress-ssr-content--></div>
    <!--vuepress-ssr-scripts-->
  </body>
</html>
