packages:
  - docs/
  - e2e/
  - plugins/*/*
  - themes/*
  - tools/*

# virtualStoreType: global

catalog:
  '@vuepress/bundler-rspack': 2.0.0-rc.32
  '@vuepress/bundler-vite': 2.0.0-rc.32
  '@vuepress/bundler-webpack': 2.0.0-rc.32
  '@vueuse/core': ^15.0.0
  chokidar: ^6.0.0
  markdown-it: ^15.0.3
  sass: ^1.108.2
  sass-embedded: ^1.108.2
  sass-loader: ^17.1.0
  vue: ^3.5.45
  vuepress: 2.0.0-rc.32
catalogPrune: true

# Pin vulnerable transitive dependencies to patched versions.
# Drop an entry once its parent package ships a release with the fix.
overrides:
  'echarts-wordcloud>echarts': ^6.1.0 # GHSA-fgmj-fm8m-jvvx
  'glob@^11.0.0': ^14.0.6 # GHSA-3g3m-2fjr-6pw4
  'glob@^13.0.0': ^14.0.6 # GHSA-3g3m-2fjr-6pw4
  'micromark-extension-math>katex': ^0.19.1 # GHSA-238p-pmpm-9mq7
  'minimatch@^10.0.0': ^11.0.8 # GHSA-g3hv-75wg-m249

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

peerDependencyRules:
  allowedVersions:
    echarts-wordcloud>echarts: ^6.0.0

minimumReleaseAgeExclude:
  - '@mdit/*'
  - '@mr-hope/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vitest/*'
  - '@vue/*'
  - '@vuepress/*'
  - '@waline/*'
  - 'oxc-config-hope'
  - 'oxfmt'
  - 'oxlint'
  - 'serve@14.2.8'
  - 'stylelint-config-hope'
  - 'vite'
  - 'vitest'
  - 'vue'
  - 'vuepress'
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 720
trustPolicyExcludePrune: true
