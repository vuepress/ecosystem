packages:
  - docs/
  - e2e/
  - plugins/*/*
  - themes/*
  - tools/*

catalog:
  '@vuepress/bundler-vite': 2.0.0-rc.30
  '@vuepress/bundler-webpack': 2.0.0-rc.30
  '@vueuse/core': ^14.4.0
  chokidar: ^5.0.0
  sass: ^1.102.0
  sass-embedded: ^1.100.0
  sass-loader: ^17.0.0
  vue: ^3.5.41
  vuepress: 2.0.0-rc.30

catalogMode: prefer

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vue/*'
  - '@vuepress/*'
  - '@vitest/*'
  - oxc-config-hope
  - oxfmt
  - oxlint
  - vite
  - vitest
  - vue
  - vuepress

packageExtensions:
  stylelint:
    peerDependencies:
      postcss-html: ^1.8.1
    peerDependenciesMeta:
      postcss-html:
        optional: true

peerDependencyRules:
  allowedVersions:
    artalk>marked: ^18.0.0
    echarts-wordcloud>echarts: ^6.0.0

cleanupUnusedCatalogs: true

# enableGlobalVirtualStore: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1' # workbox-build
  - cytoscape@3.34.1 #FIXME:
  - chokidar@4.0.3 # sass@1
  - semver@6.3.1 # @babel/core@7
  - undici-types@6.21.0 # @types/node@22
  - undici@5.29.0 # @ai-sdk/react@2 , @ai-sdk/provider-utils@3
