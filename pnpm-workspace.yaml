packages:
  - docs/
  - e2e/
  - plugins/*/*
  - themes/*
  - tools/*

# virtualStoreType: global

catalog:
  '@vuepress/bundler-rspack': 2.0.0-rc.32
  '@vuepress/bundler-vite': 2.0.0-rc.32
  '@vuepress/bundler-webpack': 2.0.0-rc.32
  '@vueuse/core': ^15.0.0
  chokidar: ^6.0.0
  markdown-it: ^15.0.3
  sass: ^1.108.2
  sass-embedded: ^1.108.2
  sass-loader: ^17.1.0
  vue: ^3.5.45
  vuepress: 2.0.0-rc.32
catalogPrune: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

peerDependencyRules:
  allowedVersions:
    echarts-wordcloud>echarts: ^6.0.0

minimumReleaseAgeExclude:
  - '@mdit/*'
  - '@mr-hope/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vitest/*'
  - '@vue/*'
  - '@vuepress/*'
  - '@waline/*'
  - 'oxc-config-hope'
  - 'oxfmt'
  - 'oxlint'
  - 'stylelint-config-hope'
  - 'vite'
  - 'vitest'
  - 'vue'
  - 'vuepress'
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 720
trustPolicyExcludePrune: true
