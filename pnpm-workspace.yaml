packages:
  - docs/
  - e2e/
  - plugins/*/*
  - themes/*
  - tools/*

# virtualStoreType: global

catalog:
  '@types/markdown-it': ^14.2.0
  '@vuepress/bundler-vite': 2.0.0-rc.31
  '@vuepress/bundler-webpack': 2.0.0-rc.31
  '@vueuse/core': ^15.0.0
  chokidar: ^5.0.0
  markdown-it: ^14.3.2
  sass: ^1.105.0
  sass-embedded: ^1.105.0
  sass-loader: ^17.0.1
  vue: ^3.5.43
  vuepress: 2.0.0-rc.31
catalogPrune: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

patchedDependencies:
  '@vuepress/bundler-webpack': patches/@vuepress__bundler-webpack.patch
peerDependencyRules:
  allowedVersions:
    echarts-wordcloud>echarts: ^6.0.0

minimumReleaseAgeExclude:
  - '@mdit/*'
  - '@mr-hope/*'
  - '@oxfmt/*'
  - '@oxlint/*'
  - '@vitest/*'
  - '@vue/*'
  - '@vuepress/*'
  - '@waline/*'
  - 'oxc-config-hope'
  - 'oxfmt'
  - 'oxlint'
  - 'stylelint-config-hope'
  - 'vite'
  - 'vitest'
  - 'vue'
  - 'vuepress'
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 720
trustPolicyExcludePrune: true
